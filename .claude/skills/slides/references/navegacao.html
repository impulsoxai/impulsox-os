<!-- Bloco de navegação de deck — injetar ANTES de </body> no HTML do deck (do Open Design
     ou do engine próprio). Dá: setas/espaço pra passar, F tela cheia, S presenter view,
     B blackout, Home/End. Funciona com scroll-snap (OD) E com display:none (engine).
     Trocar o array NOTAS pelas notas reais, na ordem dos slides. Os seletores assumem que
     cada slide é uma <section class="slide"> com data-screen-label (padrão do OD). -->
<div class="hint-nav">→ ← passar · F tela cheia · S notas · B preto</div>
<div class="presenter" id="presenter">
  <div><h3>Notas do apresentador</h3><div class="notes" id="pNotes"></div></div>
  <div><h3>Próximo slide</h3><div class="next" id="pNext"></div></div>
</div>
<div class="blackout" id="blackout"></div>
<style>
  .hint-nav{position:fixed;right:18px;top:14px;z-index:30;font-family:var(--font-mono,monospace);
    font-size:11px;letter-spacing:.08em;color:var(--muted,#888);opacity:.45}
  .presenter{position:fixed;inset:0;z-index:40;background:#000;color:#fff;display:none;
    grid-template-columns:1fr 1fr;gap:2rem;padding:2.5rem;font-family:var(--font-mono,monospace)}
  .presenter.is-on{display:grid}
  .presenter h3{font-size:.95rem;color:var(--gold,#d4af37);letter-spacing:.14em;text-transform:uppercase;margin-bottom:1rem}
  .presenter .notes{font-size:1.4rem;line-height:1.5;white-space:pre-wrap;font-family:var(--font-display,sans-serif)}
  .presenter .next{opacity:.6;font-size:1.05rem;line-height:1.4}
  .blackout{position:fixed;inset:0;background:#000;z-index:50;display:none}
  .blackout.is-on{display:block}
</style>
<script>
  const slides=[...document.querySelectorAll('section.slide')];
  // SUBSTITUIR pelas notas reais (uma por slide, na ordem):
  const NOTAS=[
    "nota do slide 1",
    "nota do slide 2"
  ];
  let i=0;
  const presenter=document.getElementById('presenter');
  const pNotes=document.getElementById('pNotes');
  const pNext=document.getElementById('pNext');
  const blackout=document.getElementById('blackout');
  function label(n){return slides[n]?(slides[n].getAttribute('data-screen-label')||slides[n].textContent.trim().slice(0,80)):'— fim —';}
  function paint(){pNotes.textContent=NOTAS[i]||'(sem nota)';pNext.textContent=slides[i+1]?label(i+1):'— fim —';}
  function go(n){i=Math.max(0,Math.min(slides.length-1,n));slides[i].scrollIntoView({behavior:'smooth',block:'start'});paint();}
  // mantém o índice em sincronia se o usuário rolar manualmente (scroll-snap)
  const io=new IntersectionObserver((es)=>{es.forEach(e=>{if(e.isIntersecting){i=slides.indexOf(e.target);paint();}});},{threshold:.6});
  slides.forEach(s=>io.observe(s));
  document.addEventListener('keydown',e=>{
    if(e.target.matches('input,textarea,[contenteditable]'))return;
    if(e.key==='ArrowRight'||e.key===' '){go(i+1);e.preventDefault();}
    else if(e.key==='ArrowLeft'){go(i-1);e.preventDefault();}
    else if(e.key==='Home'){go(0);}
    else if(e.key==='End'){go(slides.length-1);}
    else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});}
    else if(e.key==='s'||e.key==='S'){presenter.classList.toggle('is-on');}
    else if(e.key==='b'||e.key==='B'){blackout.classList.toggle('is-on');}
  });
  go(0);
</script>
